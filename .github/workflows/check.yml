name: Check

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements.txt ruff
      - run: python -m compileall -q main.py bridge.py desktop.py control.py relay.py protocol.py settings.py reports.py host_agent.py codex_mcp.py scripts tests
      - run: ruff check --select E9,F . --exclude work
      - run: python -m json.tool config.example.json
      - run: python -m json.tool _conf_schema.json
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
