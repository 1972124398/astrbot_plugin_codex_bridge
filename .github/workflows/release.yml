name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/build_release.py
      - name: Verify tag matches metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python -c "import os,pathlib; v=next(x.split(':',1)[1].strip() for x in pathlib.Path('metadata.yaml').read_text().splitlines() if x.startswith('version:')); assert os.environ['RELEASE_TAG']=='v'+v"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
